#
# Configuration file for Docker registry
# https://distribution.github.io/distribution/about/deploying/
#
# Before using, notifications/endpoints/headers/Authorization must be filled in
#
version: 0.1
log:
    level: info
    formatter: text
    fields:
        service: registry
http:
    addr: :443
    tls:
        certificate: /etc/docker/registry/ssl/certificate.pem
        key: /etc/docker/registry/ssl/privatekey.pem
    secret: http_secret

storage:
    cache:
        layerinfo: inmemory
    s3:
        region: us-east-1
        bucket: bucket_name
        encrypt: true
        secure: true
        v4auth: true
        chunksize: 104857600
        rootdirectory: /

auth:
    token:
        realm: https://repo-prod.prod.sagebase.org/docker/v1/bearerToken
        service: docker.synapse.org
        issuer: www.synapse.org
        # JWK Set derived from token_signing_key_public_cert.pem during 'cdk synth',
        # publishing the key under the libtrust-style 'kid' that Synapse's tokens carry
        jwks: /etc/docker/registry/token_signing_jwks.json

notifications:
    endpoints:
    - name: Synapse
      disabled: false
      url: https://repo-prod.prod.sagebase.org/dockerRegistryListener/v1/events
      headers:
          Authorization:
              - Basic notification_auth
      timeout: 1m
      threshold: 1
      backoff: 30s
    - name: LoggingApiGateway
      disabled: false
      url: api_gateway_url
      timeout: 1m
      threshold: 1
      backoff: 30s
