
name: synth-test

on:
  workflow_call:
    inputs:
      CONTEXT:
        required: true
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: cdk synth
        uses: youyo/aws-cdk-github-actions@v2
        env:
          # jsii refuses the package cache in /github/home, which the container (uid 0) doesn't own
          JSII_RUNTIME_PACKAGE_CACHE: disabled
        with:
          cdk_subcommand: 'synth'
          actions_comment: false
          cdk_args: '-c env=${{ inputs.CONTEXT }} --debug'
